# The host's reverse proxy (e.g. a 1Panel website) reaches this container from a private
# address and sends the visitor's address in X-Real-IP. Take the client address from there.
# This trusts every private-network peer, which is why the compose file publishes this
# port on 127.0.0.1 only.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;

server {
    listen 80;
    server_tokens off;
    include /etc/nginx/security-headers.conf;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/css application/javascript application/json;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # Overwrite, never append: the API uses this header for login rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Angular routes are handled in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # File names of built assets contain a content hash; index.html must never be cached.
    location ~* \.(js|css|woff2?)$ { expires 1y; add_header Cache-Control "public, immutable"; include /etc/nginx/security-headers.conf; }
    location = /index.html { add_header Cache-Control "no-cache"; include /etc/nginx/security-headers.conf; }
}
